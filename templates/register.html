<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELAPOS - Usajili</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px 20px;">
    <div style="max-width: 450px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        
        <!-- Ujumbe wa Ukaribisho -->
        <div style="text-align: center; margin-bottom: 20px;">
            <h2 style="color: #25d366; margin-bottom: 10px;">🚀 Karibu ELAPOS</h2>
            <p style="color: #555; font-size: 14px; line-height: 1.5; margin-bottom: 8px;">Mfumo rahisi wa kukusaidia kusimamia biashara yako ya bidhaa.</p>
            <p style="color: #666; font-size: 13px; margin-bottom: 12px;">📊 Fuatilia mauzo &bull; 📦 Stock &bull; 💰 Faida</p>
            <p style="color: #333; font-size: 13px;"><strong>Iwe biashara yako ni ndogo au kubwa — anza kuisimamia kwa data, si kwa mazoea.</strong></p>
        </div>

        <!-- Kichwa cha fomu kilichoboreshwa -->
        <h3 style="color: #333; border-bottom: 2px solid #eee; padding-bottom: 8px; margin-bottom: 20px; text-align: center;">🚀 Jisajili na Anza Kusimamia Biashara Yako</h3>
        
        <form method="POST">
            <label>Jina la Duka:</label><br>
            <input type="text" name="shop_name" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px;"><br>

            <label>Username:</label><br>
            <input type="text" name="username" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px;"><br>

            <label>Nenosiri (Password):</label><br>
            <input type="password" name="password" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px;"><br>

            <label>Namba ya Simu ya Malipo:</label><br>
            <input type="text" name="phone" placeholder="Mfano: 0680778594" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px;"><br>

            <!-- Sehemu ya Expiry imetolewa ili ifanyike kiotomatiki nyuma ya pazia -->

            <button type="submit" style="width: 100%; background-color: #007bff; color: white; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Jisajili</button>
        </form>
    </div>
</body>
</html>
