<!DOCTYPE html>
<html>
<head><title>ELAPOS - Admin Panel</title></head>
<body style="font-family: Arial; padding: 20px; text-align: center;">
    <h2>Orodha ya Wateja (Admin Panel)</h2>
    <table border="1" cellpadding="10" style="margin: 0 auto; text-align: left; border-collapse: collapse;">
        <tr style="background: #e9ecef;">
            <th>ID</th>
            <th>Duka</th>
            <th>Username</th>
            <th>Mwisho (Expiry)</th>
            <th>Hali</th>
            <th>Kitendo</th>
        </tr>
        {% for u in users %}
        <tr>
            <td>{{ u[0] }}</td>
            <td>{{ u[1] }}</td>
            <td>{{ u[2] }}</td>
            <td>{{ u[3] }}</td>
            <td>{{ u[4] }}</td>
            <td>
                {% if u[4] != 'active' %}
                    <a href="/admin/approve/{{ u[0] }}" style="color: green; font-weight: bold; text-decoration: none;">Idhinisha</a>
                {% else %}
                    <span style="color: gray; font-weight: bold;">Amekubaliwa</span>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
    <br><a href="/">Rudi Nyumbani</a>
</body>
</html>
