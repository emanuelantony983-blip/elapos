<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELAPOS - Usajili</title>
</head>
<body style="font-family: Arial; background-color: #f4f4f9; padding: 40px;">
    <div style="max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h2>Fomu ya Usajili wa Duka</h2>
        <form method="POST">
            <label>Jina la Duka:</label><br>
            <input type="text" name="shop_name" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0;"><br>
            
            <label>Username:</label><br>
            <input type="text" name="username" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0;"><br>
            
            <label>Nenosiri (Password):</label><br>
            <input type="password" name="password" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0;"><br>

            <label>Namba ya Simu ya Malipo:</label><br>
            <input type="text" name="phone" placeholder="Mfano: 0680778594" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0;"><br>
            
            <label>Mwisho wa Malipo (Expiry Date):</label><br>
            <input type="text" name="expiry" placeholder="Mfano: 2026-12-31" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0;"><br>
            
            <button type="submit" style="width: 100%; background: #007bff; color: white; padding: 10px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">Jisajili</button>
        </form>
    </div>
</body>
</html>
